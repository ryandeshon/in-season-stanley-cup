name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      dynamodb:
        image: amazon/dynamodb-local:2.6.1
        ports: ['8000:8000']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Run unit tests
        run: yarn test:unit

      - name: Run API and game checker contracts
        run: yarn test:backend

      # Keep persistence in this already-required check so it cannot be bypassed
      # as an optional new workflow when reviewing frontend or backend changes.
      - name: Run isolated persistence tests
        run: yarn test:integration

      - name: Verify complete Lambda packages
        run: yarn package:lambdas
